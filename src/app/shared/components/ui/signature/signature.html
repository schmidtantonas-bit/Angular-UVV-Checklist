<h3>Ihre Unterschrift</h3>
<div class="canvas-container">
    <canvas
        width="800"
        height="300"

        #canvas

        (pointerdown)="startDraw($event)"
        (pointermove)="updateDraw($event)"
        (pointerup)="stopDrawing($event)"
        (pointercancel)="stopDrawing($event)"
        (pointerleave)="stopDrawing($event)"
        (pointerout)="stopDrawing($event)"

        (window:resize)="updateContainer()"
    >
    </canvas>
</div>
<div class="button-container">
    <button
        (click)="clearSignature()"
        uibutton
        kind="danger"
        size="s"
        type="button"
        [disabled]="!delete()"
    >
        Löschen
    </button>
    <button
        (click)="saveSignature()"
        uibutton
        kind="success"
        size="s"
        [disabled]="!dirty()"
    >
        Speichern
    </button>
</div>
