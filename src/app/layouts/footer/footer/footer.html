<!-- htmlhint doctype-first:false -->
<footer class="layout-footer" data-ui="footer">
  <div class="container layout-footer__container" data-ui="footer-container">
    <signature></signature>
    <div class="layout-footer__actions" data-ui="footer-actions">
      <button uibutton (click)="print()">PDF runterladen</button>
      <button uibutton (click)="print('docx')">DOCX (Word) runterladen</button>
      <a style="display: none;" #download></a>
    </div>
    <div class="layout-footer__actions" data-ui="footer-actions">
      <select (change)="setMail($event)">
        <option disabled selected value="">Senden an...</option>
        @for (f of addresses(); track f) {
          <option [value]="f">{{f}}</option>
        }
      </select>
      <button uiButton (click)="mail(mailadr())" [disabled]="mailadr().length === 0">E-Mail senden</button>
    </div>
  </div>
</footer>
